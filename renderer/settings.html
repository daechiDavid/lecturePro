<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>LecturePro 설정</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #1e1e2e;
      --surface:   #2a2a3e;
      --surface2:  #313148;
      --border:    rgba(255,255,255,0.08);
      --text:      #e0e0f0;
      --text-dim:  #8888aa;
      --accent:    #7c6fcd;
      --accent-h:  #9d8fe8;
      --danger:    #e06060;
      --success:   #60c080;
      --capture:   #e09030;
      --radius:    8px;
    }

    html, body {
      width: 100%;
      height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Layout ── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .header p {
      margin-top: 3px;
      color: var(--text-dim);
      font-size: 12px;
    }

    .shortcut-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .prefs {
      border-top: 1px solid var(--border);
      padding: 12px 20px 14px;
      flex-shrink: 0;
    }

    .prefs-title {
      font-size: 12px;
      color: var(--accent-h);
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .color-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }

    .color-item label {
      font-size: 11px;
      color: var(--text-dim);
    }

    .color-item input[type="color"] {
      width: 100%;
      min-width: 70px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface2);
      padding: 2px;
      cursor: pointer;
    }

    .shortcut-list::-webkit-scrollbar { width: 5px; }
    .shortcut-list::-webkit-scrollbar-track { background: transparent; }
    .shortcut-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

    /* ── Group header ── */
    .group-header {
      padding: 10px 20px 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-h);
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    /* ── Shortcut row ── */
    .shortcut-row {
      display: flex;
      align-items: center;
      padding: 7px 20px;
      gap: 12px;
      transition: background 0.1s;
    }

    .shortcut-row:hover { background: rgba(255,255,255,0.03); }

    .shortcut-row.capturing {
      background: rgba(224, 144, 48, 0.1);
    }

    .shortcut-label {
      flex: 1;
      color: var(--text);
      font-size: 13px;
    }

    /* ── Key badge ── */
    .key-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 180px;
      justify-content: flex-end;
    }

    .key-tag {
      display: inline-block;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 12px;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      color: var(--text);
      white-space: nowrap;
    }

    .key-tag.empty {
      color: var(--text-dim);
      font-style: italic;
      font-family: inherit;
    }

    .key-tag.conflict { border-color: var(--danger); color: var(--danger); }

    /* ── Capture state ── */
    .capturing .key-tag {
      background: rgba(224, 144, 48, 0.2);
      border-color: var(--capture);
      color: var(--capture);
      animation: pulse-border 1s ease-in-out infinite;
    }

    @keyframes pulse-border {
      0%, 100% { border-color: var(--capture); }
      50%       { border-color: rgba(224,144,48,0.4); }
    }

    /* ── Buttons ── */
    .btn {
      border: none;
      border-radius: var(--radius);
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      white-space: nowrap;
    }

    .btn:active { opacity: 0.75; }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
    }
    .btn-ghost:hover { background: var(--surface2); color: var(--text); }

    .btn-capture {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      min-width: 42px;
    }
    .btn-capture:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

    .btn-capture.active {
      background: rgba(224,144,48,0.2);
      border-color: var(--capture);
      color: var(--capture);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-h); }

    .btn-danger {
      background: transparent;
      border: 1px solid rgba(224,96,96,0.4);
      color: var(--danger);
    }
    .btn-danger:hover { background: rgba(224,96,96,0.12); }

    /* ── Footer ── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      gap: 10px;
    }

    .footer-left { display: flex; gap: 8px; }
    .footer-right { display: flex; gap: 8px; }

    /* ── Status bar ── */
    .status {
      padding: 6px 20px;
      font-size: 12px;
      min-height: 28px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status.info .status-dot    { background: var(--accent); }
    .status.warn .status-dot    { background: var(--capture); }
    .status.error .status-dot   { background: var(--danger); }
    .status.success .status-dot { background: var(--success); }

    .status.info    .status-text { color: var(--text-dim); }
    .status.warn    .status-text { color: var(--capture); }
    .status.error   .status-text { color: var(--danger); }
    .status.success .status-text { color: var(--success); }

    /* ── Separator between groups ── */
    .group-sep {
      height: 1px;
      background: var(--border);
      margin: 4px 20px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>단축키 설정</h1>
      <p>항목을 클릭하여 새 단축키를 입력하세요. 변경 후 저장을 눌러야 적용됩니다.</p>
    </div>

    <div class="shortcut-list" id="list"></div>

    <div class="prefs">
      <div class="prefs-title">커스텀 색상 (5개)</div>
      <div class="color-grid" id="color-grid"></div>
    </div>

    <div class="status info" id="status">
      <div class="status-dot"></div>
      <span class="status-text" id="status-text">준비됨</span>
    </div>

    <div class="footer">
      <div class="footer-left">
        <button class="btn btn-danger" id="btn-reset">기본값 복원</button>
      </div>
      <div class="footer-right">
        <button class="btn btn-ghost" id="btn-cancel">취소</button>
        <button class="btn btn-primary" id="btn-save">저장</button>
      </div>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
