<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>LecturePro HUD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 0;
    }

    #hud {
      display: none;
      align-items: center;
      gap: 12px;
      background: rgba(10, 10, 20, 0.82);
      color: #eee;
      padding: 8px 18px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.3px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      pointer-events: none;
      white-space: nowrap;
    }

    #hud.visible { display: flex; }

    .hud-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4444;
      animation: blink 1.2s ease-in-out infinite;
      flex-shrink: 0;
    }

    .hud-dot.highlight { background: #FFD700; }
    .hud-dot.draw { background: var(--pen-color, #FF4444); }
    .hud-dot.eraser { background: #aaa; animation: none; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    #color-swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.35);
      flex-shrink: 0;
    }

    #size-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      color: rgba(255,255,255,0.55);
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="hud-dot" class="hud-dot"></div>
    <span id="hud-label"></span>
    <div id="color-swatch"></div>
    <div id="size-bar">
      <span id="size-label"></span>
    </div>
  </div>

  <script src="hud.js"></script>
</body>
</html>
